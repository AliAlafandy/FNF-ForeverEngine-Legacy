name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.2.5
  PROJECT_NAME: ForeverEngine
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Android NDK
        if: startsWith(inputs.name, 'Android')
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        if: startsWith(inputs.name, 'Android')
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: 18

      - name: Setup Android SDK
        if: startsWith(inputs.name, 'Android')
        uses: android-actions/setup-android@main

      - name: Install Android SDK Platform
        if: startsWith(inputs.name, 'Android')
        run: sdkmanager "platforms;android-31" "build-tools;31.0.0"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Activate Lime 8.3.2
        if: inputs.name == 'iOS' || startsWith(inputs.name, 'Android')
        run: |
          haxelib set lime 8.3.2
          haxelib list
          haxelib run lime --version

      - name: Configure Android
        if: startsWith(inputs.name, 'Android')
        run: | # "$ANDROID_NDK_LATEST_HOME", "JAVA_HOME_17_arm64"
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Select Android ABI
        if: startsWith(inputs.name, 'Android')
        env:
          BUILD_NAME: ${{ inputs.name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path("Project.xml")
          content = project.read_text(encoding="utf-8")
          marker = '<android target-sdk-version="31" if="android"/>'

          if os.environ["BUILD_NAME"] == "Android x64":
              architecture = "arm64"
              excluded = "armv7"
          elif os.environ["BUILD_NAME"] == "Android x32":
              architecture = "armv7"
              excluded = "arm64"
          else:
              raise SystemExit(f"Unexpected Android build name: {os.environ['BUILD_NAME']}")

          if '<architecture name=' in content:
              raise SystemExit("Project.xml already contains an architecture rule; refusing to add a duplicate.")

          rule = f'\t<architecture name="{architecture}" exclude="{excluded}" if="android" />'
          if marker not in content:
              raise SystemExit("Could not find Android target SDK marker in Project.xml.")

          project.write_text(content.replace(marker, rule + "\n" + marker, 1), encoding="utf-8")
          print(f"Configured Android ABI: {architecture}; excluded: {excluded}")
          PY

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Verify Android APK ABI
        if: startsWith(inputs.name, 'Android')
        env:
          BUILD_NAME: ${{ inputs.name }}
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          if os.environ["BUILD_NAME"] == "Android x64":
              expected = "libApplicationMain-64.so"
              forbidden = "libApplicationMain-v7.so"
          else:
              expected = "libApplicationMain-v7.so"
              forbidden = "libApplicationMain-64.so"

          apk_dir = Path("export/release/android/bin/app/build/outputs/apk/release")
          apks = list(apk_dir.glob("*.apk"))
          if not apks:
              raise SystemExit(f"No APK found in {apk_dir}")

          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  native_libs = [
                      Path(name).name for name in archive.namelist()
                      if name.endswith(".so") and "libApplicationMain-" in name
                  ]

              if expected not in native_libs:
                  raise SystemExit(f"{apk.name}: missing required {expected}; found {native_libs}")
              if forbidden in native_libs:
                  raise SystemExit(f"{apk.name}: contains forbidden {forbidden}; found {native_libs}")

              print(f"Verified {apk.name}: {expected} present; {forbidden} absent.")
          PY

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
